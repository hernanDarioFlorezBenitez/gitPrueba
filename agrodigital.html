<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agro-Digital | Edición Manzana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Verde Manzana Vibrante */
        --manzana: #8ade1b;
        --manzana-dark: #65a30d;
        /* Verde Bosque para contraste */
        --bosque: #064e3b;
        --bosque-deep: #022c22;
        --soft-bg: #f7fee7; /* Fondo sutilmente verdoso */
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--soft-bg);
        color: var(--bosque-deep);
        overflow-x: hidden;
      }

      /* Botones Especiales */
      .btn-manzana {
        background-color: var(--manzana);
        color: var(--bosque-deep);
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px 0 rgba(138, 222, 27, 0.39);
      }
      .btn-manzana:hover {
        background-color: var(--manzana-dark);
        color: white;
        transform: translateY(-2px);
      }

      .section-view {
        display: none;
      }
      .section-view.active {
        display: block;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .product-card {
        background: white;
        border: 1px solid #d9f99d;
        border-radius: 32px;
        transition: all 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 25px 50px -12px rgba(101, 163, 13, 0.15);
        border-color: var(--manzana);
      }

      .cart-sidebar {
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateX(100%);
      }
      .cart-sidebar.open {
        transform: translateX(0);
      }

      .auth-input {
        width: 100%;
        padding: 1.25rem;
        background-color: #f0fdf4;
        border-radius: 1.25rem;
        border: 2px solid transparent;
        font-size: 0.875rem;
        transition: all 0.2s;
        outline: none;
      }
      .auth-input:focus {
        border-color: var(--manzana);
        background-color: white;
      }

      /* Personalización de scroll */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--soft-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--manzana);
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div
      id="overlay"
      class="fixed inset-0 bg-emerald-950/40 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-opacity duration-300"
      onclick="toggleCart()"
    ></div>

    <!-- HEADER -->
    <header
      class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-lime-100"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center"
      >
        <div
          class="flex items-center gap-3 cursor-pointer"
          onclick="navigateTo('home')"
        >
          <div
            class="w-11 h-11 bg-emerald-900 rounded-2xl flex items-center justify-center text-[var(--manzana)] shadow-xl"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <div>
            <h1
              class="font-extrabold text-emerald-950 leading-none text-xl tracking-tighter"
            >
              AGRO<span class="text-[var(--manzana-dark)]">DIGITAL</span>
            </h1>
            <span
              class="text-[10px] font-black text-emerald-600 uppercase tracking-widest"
              >Santander Pro</span
            >
          </div>
        </div>

        <nav class="hidden md:flex gap-10">
          <button
            onclick="navigateTo('home')"
            class="text-[11px] font-black uppercase tracking-widest text-emerald-900 hover:text-[var(--manzana-dark)]"
          >
            Vitrina
          </button>
          <button
            onclick="requireAuth('orders')"
            class="text-[11px] font-black uppercase tracking-widest text-slate-400 hover:text-emerald-900 transition-colors"
          >
            Mis Pedidos
          </button>
        </nav>

        <div class="flex items-center gap-4">
          <div
            id="user-badge"
            class="hidden md:flex items-center gap-3 pr-4 border-r border-lime-100 text-right"
          >
            <div>
              <p
                id="display-name"
                class="text-xs font-black text-emerald-950 leading-none"
              ></p>
              <span
                class="text-[9px] text-[var(--manzana-dark)] font-bold uppercase"
                >Socio Activo</span
              >
            </div>
          </div>
          <button
            onclick="toggleCart()"
            class="relative w-12 h-12 bg-lime-50 rounded-2xl flex items-center justify-center text-emerald-900 hover:bg-[var(--manzana)] transition-all group"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              />
            </svg>
            <span
              id="cart-counter"
              class="absolute -top-2 -right-2 w-6 h-6 bg-emerald-900 text-[var(--manzana)] text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-lg"
              >0</span
            >
          </button>
          <button
            id="btn-login-main"
            onclick="openAuthModal('login')"
            class="hidden md:block btn-manzana px-7 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest"
          >
            Entrar
          </button>
        </div>
      </div>
    </header>

    <!-- SECCIÓN: VITRINA -->
    <main
      id="section-home"
      class="section-view active pt-32 pb-20 px-6 max-w-7xl mx-auto"
    >
      <div
        class="flex flex-col md:flex-row justify-between items-end mb-16 gap-8"
      >
        <div class="space-y-2">
          <div
            class="inline-block px-4 py-1 bg-lime-100 text-[var(--manzana-dark)] text-[10px] font-bold rounded-full uppercase tracking-widest mb-2"
          >
            Plataforma Mayorista
          </div>
          <h2 class="text-6xl font-extrabold text-emerald-950 tracking-tighter">
            Suministros de <br /><span class="text-[var(--manzana-dark)]"
              >Alta Gama</span
            >
          </h2>
        </div>
        a

        <div class="w-full md:w-80">
          <label
            class="text-[10px] font-black text-emerald-700 uppercase tracking-[0.2em] mb-3 block"
            >Categoría de Cultivo:</label
          >
          <select
            id="category-filter"
            onchange="filterByCategory(this.value)"
            class="w-full p-5 bg-white border border-lime-200 rounded-[24px] text-sm font-bold text-emerald-950 shadow-sm focus:ring-4 focus:ring-lime-100 outline-none transition-all"
          >
            <option value="Todos">Todo el Almacén</option>
            <option value="Nutrición">Nutrición & Suelos</option>
            <option value="Protección">Protección de Cultivos</option>
            <option value="Infraestructura">Infraestructura</option>
            <option value="Ganadería">Línea Ganadera</option>
          </select>
        </div>
      </div>

      <div
        id="catalog-grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"
      >
        <!-- Renderizado Dinámico -->
      </div>
    </main>

    <!-- SECCIÓN: HISTORIAL -->
    <main
      id="section-orders"
      class="section-view pt-32 pb-20 px-6 max-w-3xl mx-auto"
    >
      <div
        class="bg-white p-10 rounded-[40px] shadow-xl border border-lime-100"
      >
        <div class="flex justify-between items-center mb-10">
          <h2 class="text-3xl font-black text-emerald-950">
            Historial de <span class="text-[var(--manzana-dark)]">Socio</span>
          </h2>
          <button
            onclick="appLogout()"
            class="text-[10px] font-black text-red-500 uppercase tracking-widest bg-red-50 px-5 py-2.5 rounded-xl hover:bg-red-500 hover:text-white transition-colors"
          >
            Cerrar Sesión
          </button>
        </div>
        <div id="orders-container" class="space-y-4"></div>
      </div>
    </main>

    <!-- MODAL AUTENTICACIÓN -->
    <div
      id="modal-auth"
      class="fixed inset-0 z-[150] bg-emerald-950/95 backdrop-blur-xl hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white w-full max-w-md rounded-[45px] p-12 shadow-2xl relative overflow-hidden border-t-8 border-[var(--manzana)]"
      >
        <button
          onclick="closeModal('modal-auth')"
          class="absolute top-8 right-8 text-slate-400 hover:text-emerald-950 transition-colors font-bold text-xl"
        >
          ✕
        </button>
        <div id="auth-content"></div>
      </div>
    </div>

    <!-- MODAL PRODUCTO -->
    <div
      id="modal-product"
      class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white w-full max-w-xl rounded-[45px] p-12 relative shadow-2xl"
      >
        <button
          onclick="closeModal('modal-product')"
          class="absolute top-8 right-8 font-bold text-slate-400 text-xl"
        >
          ✕
        </button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- CARRITO SIDEBAR -->
    <aside
      id="cart-sidebar"
      class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-[70] cart-sidebar shadow-2xl flex flex-col border-l border-lime-100"
    >
      <div
        class="p-10 border-b border-lime-50 flex justify-between items-center bg-emerald-950 text-white"
      >
        <h3 class="text-2xl font-black tracking-tight text-[var(--manzana)]">
          Tu Carrito
        </h3>
        <button
          onclick="toggleCart()"
          class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center font-bold hover:bg-white/20"
        >
          ✕
        </button>
      </div>
      <div
        id="cart-items"
        class="flex-1 overflow-y-auto p-8 space-y-4 bg-lime-50/30"
      ></div>
      <div class="p-10 bg-white border-t border-lime-100">
        <div class="flex justify-between items-center mb-8">
          <span
            class="text-xs font-bold text-slate-400 uppercase tracking-widest"
            >Total del Pedido</span
          >
          <span id="cart-total" class="text-4xl font-black text-emerald-950"
            >$0</span
          >
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
          <button
            id="pay-Nequi"
            onclick="setPayment('Nequi')"
            class="p-5 bg-slate-50 border-2 border-transparent rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-lime-50 transition-all flex flex-col items-center gap-2"
          >
            <span class="text-lg">💜</span> Nequi
          </button>
          <button
            id="pay-Efectivo"
            onclick="setPayment('Efectivo')"
            class="p-5 bg-slate-50 border-2 border-transparent rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-lime-50 transition-all flex flex-col items-center gap-2"
          >
            <span class="text-lg">💵</span> Efectivo
          </button>
        </div>

        <button
          onclick="processCheckout()"
          class="w-full btn-manzana py-6 rounded-[24px] font-black text-[12px] uppercase tracking-[0.2em] shadow-2xl"
        >
          Confirmar Compra
        </button>
      </div>
    </aside>

    <div
      id="toast"
      class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-emerald-950 text-[var(--manzana)] px-10 py-5 rounded-[20px] text-[11px] font-black uppercase tracking-widest shadow-2xl hidden z-[200] border border-[var(--manzana)]/30 animate-slideUp"
    ></div>

    <script>
      const App = {
        user: JSON.parse(localStorage.getItem("ad_user")) || null,
        orders: JSON.parse(localStorage.getItem("ad_orders")) || [],
        cart: [],
        payMethod: null,
        pendingAction: null,
        products: [
          {
            id: 1,
            name: "Fertilizante Master NPK",
            cat: "Nutrición",
            icon: "🌱",
            variants: [
              { n: "Bulto 50kg", p: 165000 },
              { n: "Saco 20kg", p: 75000 },
            ],
          },
          {
            id: 2,
            name: "Herbicida Total-Kill",
            cat: "Protección",
            icon: "🧪",
            variants: [
              { n: "Garrafa 20L", p: 420000 },
              { n: "Galón 4L", p: 92000 },
            ],
          },
          {
            id: 3,
            name: "Malla Triple Torsión",
            cat: "Infraestructura",
            icon: "⛓️",
            variants: [
              { n: "Rollo 100m", p: 850000 },
              { n: "Rollo 50m", p: 450000 },
            ],
          },
          {
            id: 4,
            name: "Semilla Pasto Brachiaria",
            cat: "Ganadería",
            icon: "🌾",
            variants: [
              { n: "Bulto 20kg", p: 580000 },
              { n: "Kilo", p: 32000 },
            ],
          },
          {
            id: 5,
            name: "Alimento Equinos Premium",
            cat: "Ganadería",
            icon: "🐴",
            variants: [{ n: "Bulto 40kg", p: 125000 }],
          },
          {
            id: 6,
            name: "Cal Dolomita Especial",
            cat: "Nutrición",
            icon: "🏔️",
            variants: [{ n: "Bulto 50kg", p: 35000 }],
          },
        ],
      };

      let currentProd = null;
      let currentVarIdx = 0;

      // --- AUTH ---
      function openAuthModal(mode = "login") {
        document.getElementById("modal-auth").classList.remove("hidden");
        renderAuthForm(mode);
      }

      function renderAuthForm(mode) {
        const container = document.getElementById("auth-content");
        if (mode === "login") {
          container.innerHTML = `
                    <div class="text-center">
                        <div class="w-20 h-20 bg-lime-50 rounded-[30px] flex items-center justify-center text-4xl mx-auto mb-8 shadow-inner border border-lime-100">🔑</div>
                        <h4 class="text-3xl font-black text-emerald-950 mb-3 tracking-tighter">Acceso de Socio</h4>
                        <p class="text-sm text-slate-500 mb-10">Ingrese para gestionar sus compras.</p>
                        
                        <div class="space-y-5 text-left">
                            <input type="email" id="auth-email" class="auth-input" placeholder="Correo electrónico">
                            <input type="password" id="auth-pass" class="auth-input" placeholder="Contraseña">
                        </div>

                        <button onclick="handleAuth('login')" class="w-full btn-manzana py-5 rounded-2xl font-black uppercase tracking-widest text-[11px] mt-10 shadow-lg">Entrar al Sistema</button>
                        
                        <p class="mt-10 text-xs font-bold text-slate-400">
                            ¿Aún no eres socio? 
                            <button onclick="renderAuthForm('register')" class="text-emerald-700 hover:text-[var(--manzana-dark)] underline">Crea una cuenta</button>
                        </p>
                    </div>
                `;
        } else {
          container.innerHTML = `
                    <div class="text-center">
                        <div class="w-20 h-20 bg-lime-50 rounded-[30px] flex items-center justify-center text-4xl mx-auto mb-8 shadow-inner border border-lime-100">🌿</div>
                        <h4 class="text-3xl font-black text-emerald-950 mb-3 tracking-tighter">Únete a la Red</h4>
                        <p class="text-sm text-slate-500 mb-10">Crea tu perfil de socio productor.</p>
                        
                        <div class="space-y-5 text-left">
                            <input type="text" id="reg-name" class="auth-input" placeholder="Nombre Completo">
                            <input type="email" id="reg-email" class="auth-input" placeholder="Correo electrónico">
                            <input type="password" id="reg-pass" class="auth-input" placeholder="Crea tu contraseña">
                        </div>

                        <button onclick="handleAuth('register')" class="w-full btn-manzana py-5 rounded-2xl font-black uppercase tracking-widest text-[11px] mt-10 shadow-lg">Finalizar Registro</button>
                        
                        <p class="mt-10 text-xs font-bold text-slate-400">
                            ¿Ya tienes cuenta? 
                            <button onclick="renderAuthForm('login')" class="text-emerald-700 hover:text-[var(--manzana-dark)] underline">Inicia sesión</button>
                        </p>
                    </div>
                `;
        }
      }

      function handleAuth(type) {
        const email =
          type === "login"
            ? document.getElementById("auth-email").value
            : document.getElementById("reg-email").value;
        const name =
          type === "register"
            ? document.getElementById("reg-name").value
            : email.split("@")[0];

        if (!email) return showToast("Por favor ingrese su correo", true);

        App.user = { name: name.toUpperCase(), email: email };
        localStorage.setItem("ad_user", JSON.stringify(App.user));

        closeModal("modal-auth");
        updateUI();
        showToast(`Bienvenido de nuevo, ${name}`);

        if (App.pendingAction === "checkout") completeOrder();
        if (App.pendingAction === "orders") {
          navigateTo("orders");
          renderOrders();
        }
        App.pendingAction = null;
      }

      function appLogout() {
        localStorage.removeItem("ad_user");
        App.user = null;
        location.reload();
      }

      // --- VITRINA ---
      function renderCatalog(filter = "Todos") {
        const grid = document.getElementById("catalog-grid");
        const filtered =
          filter === "Todos"
            ? App.products
            : App.products.filter((p) => p.cat === filter);

        grid.innerHTML = filtered
          .map(
            (p) => `
                <div class="product-card p-8 flex flex-col cursor-pointer group" onclick="openDetail(${p.id})">
                    <div class="w-full aspect-square bg-lime-50/50 rounded-[35px] mb-8 flex items-center justify-center text-7xl group-hover:scale-105 transition-transform duration-500">
                        ${p.icon}
                    </div>
                    <span class="text-[10px] font-black text-[var(--manzana-dark)] uppercase tracking-widest mb-2">${p.cat}</span>
                    <h4 class="text-2xl font-extrabold text-emerald-950 leading-tight mb-6">${p.name}</h4>
                    <div class="mt-auto pt-6 border-t border-lime-50 flex justify-between items-center">
                        <div class="space-y-1">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Precios desde</p>
                            <p class="text-xl font-black text-emerald-950">$${p.variants[p.variants.length - 1].p.toLocaleString()}</p>
                        </div>
                        <div class="w-12 h-12 bg-emerald-950 text-[var(--manzana)] rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg group-hover:bg-[var(--manzana-dark)] group-hover:text-white transition-all">＋</div>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      function openDetail(id) {
        currentProd = App.products.find((p) => p.id === id);
        currentVarIdx = 0;
        document.getElementById("modal-product").classList.remove("hidden");
        renderDetailModal();
      }

      function renderDetailModal() {
        const p = currentProd;
        document.getElementById("modal-body").innerHTML = `
                <div class="flex flex-col md:flex-row gap-10 items-center mb-10">
                    <div class="w-40 h-40 bg-lime-50 rounded-[40px] flex items-center justify-center text-7xl shadow-inner border border-lime-100">${p.icon}</div>
                    <div class="text-center md:text-left">
                        <span class="inline-block px-4 py-1 bg-lime-100 text-[var(--manzana-dark)] text-[10px] font-bold rounded-full uppercase tracking-widest mb-3">${p.cat}</span>
                        <h4 class="text-4xl font-black text-emerald-950 leading-tight">${p.name}</h4>
                    </div>
                </div>
                <div class="space-y-4">
                    <p class="text-[11px] font-black text-slate-500 uppercase tracking-[0.2em] mb-4">Presentaciones Disponibles:</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${p.variants
                          .map(
                            (v, i) => `
                            <div onclick="currentVarIdx=${i}; renderDetailModal();" class="p-6 rounded-3xl border-2 flex justify-between items-center cursor-pointer transition-all
                                ${currentVarIdx === i ? "border-[var(--manzana)] bg-lime-50" : "border-slate-100 hover:border-lime-200"}">
                                <span class="text-xs font-bold text-slate-700">${v.n}</span>
                                <span class="text-lg font-black text-emerald-950">$${v.p.toLocaleString()}</span>
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                </div>
                <button onclick="addToCart()" class="w-full btn-manzana py-6 rounded-[28px] font-black uppercase tracking-[0.2em] text-[12px] mt-10 shadow-2xl">Añadir al Pedido</button>
            `;
      }

      function addToCart() {
        const v = currentProd.variants[currentVarIdx];
        App.cart.push({
          name: `${currentProd.name} (${v.n})`,
          price: v.p,
          icon: currentProd.icon,
        });
        updateCartUI();
        closeModal("modal-product");
        showToast("Insumo agregado al resumen");
      }

      function updateCartUI() {
        const list = document.getElementById("cart-items");
        document.getElementById("cart-counter").innerText = App.cart.length;

        if (App.cart.length === 0) {
          list.innerHTML = `<div class="py-20 text-center opacity-30 flex flex-col items-center gap-4">
                    <span class="text-6xl">🧺</span>
                    <p class="text-[10px] font-black uppercase tracking-widest">Carrito Vacío</p>
                </div>`;
        } else {
          list.innerHTML = App.cart
            .map(
              (item, idx) => `
                    <div class="bg-white p-5 rounded-3xl flex items-center gap-5 shadow-sm border border-lime-100 animate-slideUp">
                        <div class="text-3xl">${item.icon}</div>
                        <div class="flex-1">
                            <p class="text-[11px] font-black text-emerald-950 uppercase leading-tight">${item.name}</p>
                            <p class="text-lg font-black text-[var(--manzana-dark)]">$${item.price.toLocaleString()}</p>
                        </div>
                        <button onclick="App.cart.splice(${idx},1); updateCartUI();" class="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-red-500 text-lg">✕</button>
                    </div>
                `,
            )
            .join("");
        }
        const total = App.cart.reduce((s, i) => s + i.price, 0);
        document.getElementById("cart-total").innerText =
          `$${total.toLocaleString()}`;
      }

      function setPayment(m) {
        App.payMethod = m;
        document.querySelectorAll('[id^="pay-"]').forEach((b) => {
          b.classList.remove(
            "border-[var(--manzana)]",
            "bg-lime-50",
            "ring-2",
            "ring-lime-200",
          );
        });
        const btn = document.getElementById(`pay-${m}`);
        btn.classList.add(
          "border-[var(--manzana)]",
          "bg-lime-50",
          "ring-2",
          "ring-lime-200",
        );
      }

      function processCheckout() {
        if (App.cart.length === 0)
          return showToast("Primero selecciona tus insumos", true);
        if (!App.payMethod) return showToast("Elige cómo vas a pagar", true);

        if (!App.user) {
          App.pendingAction = "checkout";
          openAuthModal("login");
        } else {
          completeOrder();
        }
      }

      function completeOrder() {
        const total = App.cart.reduce((s, i) => s + i.price, 0);
        const order = {
          id: "AD" + Date.now().toString().slice(-6),
          date: new Date().toLocaleDateString(),
          total: total,
          status: "EN CAMINO",
        };
        App.orders.unshift(order);
        localStorage.setItem("ad_orders", JSON.stringify(App.orders));
        App.cart = [];
        updateCartUI();
        toggleCart();
        showToast("¡Pedido recibido! Pronto despacharemos.");
        renderOrders();
        navigateTo("orders");
      }

      function filterByCategory(val) {
        renderCatalog(val);
      }
      function navigateTo(sec) {
        document
          .querySelectorAll(".section-view")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(`section-${sec}`).classList.add("active");
      }

      function requireAuth(sec) {
        if (!App.user) {
          App.pendingAction = sec;
          openAuthModal("login");
        } else {
          if (sec === "orders") renderOrders();
          navigateTo(sec);
        }
      }

      function renderOrders() {
        const cont = document.getElementById("orders-container");
        if (App.orders.length === 0) {
          cont.innerHTML = `<p class="py-10 text-center text-slate-400 font-bold uppercase text-[10px]">No tienes requisiciones registradas.</p>`;
          return;
        }
        cont.innerHTML = App.orders
          .map(
            (o) => `
                <div class="bg-white p-8 rounded-[30px] border border-lime-100 flex justify-between items-center hover:bg-lime-50 transition-colors shadow-sm">
                    <div class="space-y-1">
                        <span class="text-[10px] font-black text-[var(--manzana-dark)] uppercase tracking-widest">${o.id}</span>
                        <p class="text-xl font-extrabold text-emerald-950">${o.date}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-black text-emerald-950">$${o.total.toLocaleString()}</p>
                        <span class="text-[10px] font-black text-emerald-950 bg-[var(--manzana)] px-4 py-1.5 rounded-full uppercase shadow-sm">${o.status}</span>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      function updateUI() {
        if (App.user) {
          document.getElementById("user-badge").classList.remove("hidden");
          document.getElementById("display-name").innerText = App.user.name;
          document.getElementById("btn-login-main").classList.add("hidden");
        }
      }

      function toggleCart() {
        document.getElementById("cart-sidebar").classList.toggle("open");
        document.getElementById("overlay").classList.toggle("opacity-0");
        document
          .getElementById("overlay")
          .classList.toggle("pointer-events-none");
      }
      function closeModal(id) {
        document.getElementById(id).classList.add("hidden");
      }
      function showToast(m, e = false) {
        const t = document.getElementById("toast");
        t.innerText = m;
        t.style.borderColor = e ? "#ef4444" : "#8ade1b";
        t.classList.remove("hidden");
        setTimeout(() => t.classList.add("hidden"), 3500);
      }

      window.onload = () => {
        renderCatalog();
        updateUI();
        updateCartUI();
      };
    </script>
  </body>
</html>
